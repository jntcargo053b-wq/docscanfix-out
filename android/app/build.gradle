plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

// Prefix "ks" agar tidak bentrok dengan DSL setter di dalam signingConfigs block
def ksStorePassword = System.getenv("KEY_STORE_PASSWORD") ?: localProperties.getProperty("KEY_STORE_PASSWORD", "")
def ksKeyAlias      = System.getenv("KEY_ALIAS")          ?: localProperties.getProperty("KEY_ALIAS", "")
def ksKeyPassword   = System.getenv("KEY_PASSWORD")        ?: localProperties.getProperty("KEY_PASSWORD", "")

android {
    namespace "com.example.docscan"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            storeFile     file("keystore.jks")
            storePassword ksStorePassword
            keyAlias      ksKeyAlias
            keyPassword   ksKeyPassword
        }
    }

    defaultConfig {
        applicationId "com.example.docscan"
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
