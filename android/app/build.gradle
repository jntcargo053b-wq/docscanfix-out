plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.example.docscan"

    // PERBAIKAN: turunkan compileSdk dari 36 ke 34
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.docscan"

        // PERBAIKAN: turunkan minSdk? Tidak wajib, 24 aman. Tapi lebih baik 21 untuk ML Kit
        minSdk 21
        targetSdk 34   // sesuaikan dengan compileSdk

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file('keystore.jks')
            def storePass    = System.getenv('KEY_STORE_PASSWORD')
            def keyAls       = System.getenv('KEY_ALIAS')
            def keyPass      = System.getenv('KEY_PASSWORD')

            if (keystoreFile.exists() && storePass && keyAls && keyPass) {
                storeFile     keystoreFile
                storePassword storePass
                keyAlias      keyAls
                keyPassword   keyPass
            }
        }
    }

    buildTypes {
        release {
            def isCI = System.getenv('CI') == 'true'
            signingConfig isCI ? signingConfigs.release : signingConfigs.debug

            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
