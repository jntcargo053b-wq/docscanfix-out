name: Build Latest APK

on:
push:
branches:
- main

jobs:
build-release:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Install Dependencies
    run: flutter pub get

  - name: Decode Keystore
    run: |
      echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 --decode > android/app/keystore.jks

  - name: Validate Keystore
    run: |
      keytool -list -keystore android/app/keystore.jks \
        -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
        -noprompt

  - name: Build Release APK
    run: |
      flutter build apk --release \
        --target-platform android-arm64 \
        --obfuscate \
        --split-debug-info=debug-info/
    env:
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  - name: Delete Previous Latest Release
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      gh release delete latest -y || true

  - name: Delete Previous Latest Tag
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      git push origin :refs/tags/latest || true

  - name: Create Latest Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: latest
      name: Latest APK
      generate_release_notes: true
      files: |
        build/app/outputs/flutter-apk/app-release.apk
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
