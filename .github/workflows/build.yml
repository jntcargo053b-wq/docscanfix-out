name: Build and Release APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - build_branch
  push:
    branches:
      - build_branch
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Test
        run: flutter test

      # Flutter 3.29.3's Gradle plugin imports groovy.xml.QName.
      # Restore the Groovy XML module omitted from its Gradle plugin classpath.
      - name: Restore Flutter Groovy XML module
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          flutter_root = Path(os.environ["FLUTTER_ROOT"])
          gradle_file = flutter_root / "packages" / "flutter_tools" / "gradle" / "build.gradle.kts"
          text = gradle_file.read_text(encoding="utf-8")
          dependency = 'implementation("org.codehaus.groovy:groovy-xml:3.0.17")'

          if dependency not in text:
              marker = "dependencies {\n"
              if marker not in text:
                  raise SystemExit(f"Unable to locate dependencies block in {gradle_file}")
              text = text.replace(marker, marker + f"    {dependency}\n", 1)
              gradle_file.write_text(text, encoding="utf-8")

          if dependency not in gradle_file.read_text(encoding="utf-8"):
              raise SystemExit("Groovy XML dependency was not applied")
          print(f"Groovy XML dependency configured in {gradle_file}")
          PY

      - name: Build Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: flutter build apk --debug --verbose

      - name: Upload Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release --split-per-abi --verbose

      - name: Upload Release APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
