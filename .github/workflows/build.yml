name: Build and Release APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - build_branch
  push:
    branches:
      - build_branch
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Test
        run: flutter test

      # Use Gradle 8.9 explicitly. Flutter 3.29.3's Gradle plugin is not
      # compatible with Gradle 9.x's embedded Groovy 4 runtime.
      - name: Setup compatible Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle_version="8.9"
          gradle_dir="$RUNNER_TEMP/gradle-$gradle_version"
          curl --fail --silent --show-error --location \
            "https://services.gradle.org/distributions/gradle-$gradle_version-bin.zip" \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          # Flutter calls android/gradlew, which prefers GRADLE_HOME over PATH.
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-$gradle_version" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gradle-$gradle_version/bin" >> "$GITHUB_PATH"
          export GRADLE_HOME="$RUNNER_TEMP/gradle-$gradle_version"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version
          gradle --version | grep -Fqx "Gradle $gradle_version"

      - name: Build Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: flutter build apk --debug --verbose

      - name: Upload Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Build a release APK on branch pushes and manual runs too, so it is
      # available as a workflow artifact without requiring a version tag.
      # Pull requests remain validation/debug-only.
      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi --verbose

      - name: Upload Release APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # A published GitHub Release still requires pushing a version tag (v*).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
