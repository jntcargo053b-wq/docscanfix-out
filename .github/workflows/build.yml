# CI trigger marker: keep this workflow active on build_branch for automatic push validation.
# CI trigger: validate PDF regression test after deterministic chunk-test fix.
# CI trigger: validate analyzer fixes for PDF callback and Stream filtering.
name: Build and Release APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - build_branch
  push:
    branches:
      - build_branch
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Test
        run: flutter test

      # Use Gradle 8.9 explicitly. Flutter 3.29.3's Gradle plugin is not
      # compatible with Gradle 9.x's embedded Groovy 4 runtime.
      - name: Setup compatible Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle_version="8.9"
          gradle_dir="$RUNNER_TEMP/gradle-$gradle_version"
          curl --fail --silent --show-error --location \
            "https://services.gradle.org/distributions/gradle-$gradle_version-bin.zip" \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-$gradle_version" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gradle-$gradle_version/bin" >> "$GITHUB_PATH"
          export GRADLE_HOME="$RUNNER_TEMP/gradle-$gradle_version"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version
          gradle --version | grep -Fqx "Gradle $gradle_version"

      - name: Build Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: flutter build apk --debug --verbose

      - name: Upload Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Release APKs must use the same stable private key on every build.
      # These secrets are required for branch pushes and manual release builds.
      - name: Configure release signing from GitHub Secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          # Gradle resolves storeFile relative to android/app, so use the filename only.
          printf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=%s\\nstoreFile=upload-keystore.jks\\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --verbose

      - name: Upload Release APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
