name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - build_branch
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Flutter, Dart and Gradle versions
        run: |
          flutter --version
          dart --version
          gradle --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Test
        run: flutter test

      - name: Restore Flutter Groovy XML module
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          flutter_root = Path(os.environ['FLUTTER_ROOT'])
          gradle_file = flutter_root / 'packages' / 'flutter_tools' / 'gradle' / 'build.gradle.kts'
          text = gradle_file.read_text(encoding='utf-8')
          dependency = 'implementation("org.codehaus.groovy:groovy-xml:3.0.17")'

          if dependency not in text:
              marker = 'dependencies {\n'
              if marker not in text:
                  raise SystemExit(f'Unable to locate dependencies block in {gradle_file}')
              text = text.replace(marker, marker + f'    {dependency}\n', 1)
              gradle_file.write_text(text, encoding='utf-8')

          print(f'Patched Flutter Gradle plugin: {gradle_file}')
          print(f'Groovy XML dependency present: {dependency in gradle_file.read_text(encoding="utf-8")}')
          PY

      - name: Build Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug

      - name: Upload Debug APK
        if: github.ref == 'refs/heads/build_branch' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
