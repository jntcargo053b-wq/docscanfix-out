name: docscan
description: Document Scanner App with OCR and PDF Export
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ^1.2.3
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.15.1
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  share_plus: ^10.1.4
  open_file: ^3.3.2
  permission_handler: ^12.0.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  gal: ^1.1.3
  image: ^4.1.7
  cupertino_icons: ^1.0.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
